<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1e293b; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: {{ header_color | default('#2563eb') }}; color: white; padding: 24px; border-radius: 8px 8px 0 0; }
        .content { background: #f8fafc; padding: 32px; border-radius: 0 0 8px 8px; border: 1px solid #e2e8f0; border-top: none; }
        .footer { margin-top: 32px; text-align: center; color: #64748b; font-size: 14px; }
        .button { background: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: 600; }
        .alert-box { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 16px; margin: 16px 0; border-radius: 4px; }
        .info-box { background: #dbeafe; border-left: 4px solid #2563eb; padding: 16px; margin: 16px 0; border-radius: 4px; }
        .warning-box { background: #fef2f2; border-left: 4px solid #ef4444; padding: 16px; margin: 16px 0; border-radius: 4px; }
        h1 { margin: 0; font-size: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ title }}</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
            
            {% if action_url %}
            <div style="margin-top: 32px; text-align: center;">
                <a href="{{ action_url }}" class="button">{{ action_text | default('View Details') }}</a>
            </div>
            {% endif %}
        </div>
        <div class="footer">
            <p>This is an automated alert from RackPlane.<br>
            You can manage your notification preferences in your account settings.</p>
        </div>
    </div>
</body>
</html>
