[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    # Core Categories
    unit: Unit tests (no external dependencies)
    integration: Integration tests requiring API and database
    e2e: End-to-end tests
    critical: Critical tests that must pass
    regression: Regression tests for specific bug fixes
    slow: Slow running tests (> 5 seconds)
    docker: Tests requiring Docker containers

    # Edition markers (for OSS vs Full/Premium separation)
    oss: Tests that should run in OSS builds (single-tenant, no premium features)
    premium: Tests requiring premium features (multi-tenant, integrations, billing)

    # Functional Areas
    auth: Authentication and authorization tests
    rbac: Role-based access control tests
    tenant: Tenant management and isolation tests
    onboarding: Tenant onboarding tests
    
    # Asset Management
    asset: Asset management tests
    stock: Stock management tests
    rack: Rack management tests
    storage: Storage container tests
    cable: Cable management tests
    connection: Connection tests
    network_cable: Network cable tests
    power_cable: Power cable tests
    
    # Features
    backup: Backup and restore tests
    full_restore: Full system restore tests
    csv: CSV import/export tests
    audit: Audit log tests
    dashboard: Dashboard tests
    report: Reporting tests
    search: Global search tests
    barcode: Barcode generation tests
    photos: Photo management tests
    image: Image handling tests
    features: General feature tests
    workflow: Workflow tests
    
    # Integrations
    netbox: NetBox integration tests
    vendor_lookup: Vendor API lookup tests
    
    # Monitoring & Environment
    environmental: Environmental monitoring tests
    environment: Environment settings tests
    thresholds: Capacity and sensor threshold tests
    maintenance: Maintenance schedule tests
    
    # Specific Checks
    duplicate_prevention: Duplicate data prevention tests
    user_role: User role tests
    frontend: Frontend integration and API contract tests
    demo_db_seed: Tests that require demo database seed (restores demo_seed.dump)

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=0

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

